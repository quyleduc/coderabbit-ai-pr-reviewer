name: OpenAI Reviewer

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

concurrency:
  group:
    ${{ github.repository }}-${{ github.event.number || github.head_ref ||
    github.sha }}-${{ github.workflow }}-${{ github.event_name ==
    'pull_request_review_comment' && 'pr_comment' || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  review:
    # Privileged automatic review requires an explicit repository opt-in.
    if: vars.ENABLE_AUTOMATED_PR_REVIEWS == 'true'
    runs-on: ubuntu-latest
    steps:
      # Always execute this local action from trusted base-repository code.
      # PR head code is untrusted under pull_request_target, which has
      # write permissions and access to OPENAI_API_KEY.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false
      # The committed dist bundle is historical; rebuild from trusted
      # default-branch sources so source fixes are actually used by the action.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build trusted local action
        run: |
          npm ci
          npm run build
          npm run package
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ vars.LLM_PROVIDER != 'openrouter' && secrets.OPENAI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ vars.LLM_PROVIDER == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        with:
          debug: false
          review_comment_lgtm: false
          llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          # M1 free baseline when OpenRouter is selected; explicit repo vars win.
          openai_light_model: ${{ vars.LLM_LIGHT_MODEL || (vars.LLM_PROVIDER == 'openrouter' && 'google/gemma-4-31b-it:free' || 'gpt-6-luna') }}
          openai_heavy_model: ${{ vars.LLM_HEAVY_MODEL || (vars.LLM_PROVIDER == 'openrouter' && 'google/gemma-4-31b-it:free' || 'gpt-6.1-sol') }}
          path_filters: |
            !dist/**
            !**/*.lock
