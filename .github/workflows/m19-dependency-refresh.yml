name: M1.9 dependency refresh (maintainer branch only)

on:
  push:
    branches: [feat/m1-9-openrouter-provider]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: m19-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # No untrusted PR or fork can cause privileged dependency writes.
    if: github.repository == 'quyleduc/coderabbit-ai-pr-reviewer' && github.actor == 'quyleduc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m1-9-openrouter-provider
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve declared versions into lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Apply non-breaking npm security updates
        shell: bash
        run: |
          npm audit fix --ignore-scripts --no-fund || true
          npm ci --ignore-scripts --no-fund
      - name: Verify Node 22 regression suite, TS build and Action packaging
        run: |
          node --experimental-strip-types --test tests/*.test.mjs
          npm run build
          npm run package
      - name: Report remaining security advisories
        shell: bash
        run: |
          npm audit --json > /tmp/final-audit.json || true
          node -e 'const a=require("/tmp/final-audit.json"); console.log("FINAL AUDIT COUNTS",JSON.stringify(a.metadata?.vulnerabilities??{})); for(const [name,v] of Object.entries(a.vulnerabilities??{})) console.log("REMAINING", JSON.stringify({name,severity:v.severity,fixAvailable:v.fixAvailable}))'
      - name: Commit verified lockfile and manifest only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(m1.9): refresh audited dependencies and npm lockfile"
            git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:refs/heads/feat/m1-9-openrouter-provider
          fi
