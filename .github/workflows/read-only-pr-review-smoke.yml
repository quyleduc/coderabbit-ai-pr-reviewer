name: Read-only PR review smoke

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  actual-pr-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual PR diff with synthetic model and fake GitHub review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/read-only-review-smoke.mjs
