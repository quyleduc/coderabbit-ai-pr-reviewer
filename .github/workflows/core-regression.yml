name: Core regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diff-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure diff parser regressions
        run: node --experimental-strip-types --test tests/*.test.mjs

  build-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build and action bundle
        run: |
          npm run build
          npm run package
