name: Core regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diff-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure diff parser regressions
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Controlled embedded-C fixture benchmark (mock, no credentials)
        run: node --experimental-strip-types scripts/controlled-model-eval.mjs --mock

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts --no-fund
      - name: Reject all known npm advisories including low severity
        run: npm audit --audit-level=low

  build-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build and action bundle
        run: |
          npm run build
          npm run package
